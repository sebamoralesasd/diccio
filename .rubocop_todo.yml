# Excepciones deliberadas. La idea es ir vaciando este archivo: si una entrada
# deja de hacer falta, se borra en vez de dejarla acumulando.

# El schema es un heredoc de DDL: partirlo en dos métodos no lo haría más claro.
Metrics/MethodLength:
  Max: 13

# Las clases se documentan solas por su nombre y su tamaño; los comentarios de
# clase envejecen mal y nadie los lee.
Style/Documentation:
  Enabled: false
